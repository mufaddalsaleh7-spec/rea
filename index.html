<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VectorStudio — Illustrator-grade vector workspace</title>
    <meta name="description" content="VectorStudio: an Adobe Illustrator-style vector illustration workspace that runs entirely in the browser, built alongside REA and VectorCraft." />
    <link rel="canonical" href="https://mufaddalsaleh7-spec.github.io/rea/vectorstudio.html" />
    <meta http-equiv="refresh" content="0; url=vectorstudio.html" />
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        background: #1b1b1b; color: #d3d3d3;
        font: 400 14px/1.6 "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
        text-align: center; padding: 24px;
      }
      a { color: #6db3f2; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 18px;
        display: grid; place-items: center; border-radius: 10px;
        background: #330000; color: #ff9a00; font: 700 22px Georgia, serif;
      }
      h1 { font-size: 18px; font-weight: 500; margin: 0 0 6px; color: #fff; }
      p { margin: 0 0 14px; color: #9a9a9a; font-size: 12.5px; }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">Vs</div>
      <h1>Opening VectorStudio…</h1>
      <p>If nothing happens, <a href="vectorstudio.html">open the editor</a>.</p>
    </div>

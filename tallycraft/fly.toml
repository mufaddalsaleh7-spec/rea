# Fly.io configuration.
#
#   fly launch --no-deploy --copy-config --dockerfile tallycraft/Dockerfile
#   fly volumes create tallycraft_data --size 1 --region sin
#   fly secrets set PUBLIC_URL=https://<app>.fly.dev
#   fly deploy
#
# Keep exactly one machine: two machines mounting the same volume would mean
# two writers on one SQLite file.
app = "tallycraft"
primary_region = "sin"

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
PORT = "3000"
HOST = "0.0.0.0"
TALLYCRAFT_DB = "/data/tallycraft.db"
TALLYCRAFT_DEMO = "0"

[[mounts]]
source = "tallycraft_data"
destination = "/data"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 1

[http_service.http_options.response]
pristine = true

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/healthz"
timeout = "3s"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

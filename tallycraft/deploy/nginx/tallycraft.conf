# Reverse proxy with TLS. Certbot writes the ssl_* lines; the rest is what
# TallyCraft needs: a real host, the client's address, and no caching of API
# responses (a stale trial balance is worse than a slow one).
server {
    listen 80;
    listen [::]:80;
    server_name books.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name books.example.com;

    # ssl_certificate ... (certbot)
    # ssl_certificate_key ...

    # Accounting data is not public: put an identity layer in front until the
    # app has its own accounts.
    # auth_basic "TallyCraft";
    # auth_basic_user_file /etc/nginx/tallycraft.htpasswd;
    # allow 203.0.113.0/24;
    # deny all;

    client_max_body_size 16m;      # Tally XML imports
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # Never cache the API, the service worker, or the shell.
    location ~ ^/(api/|sw\.js$|manifest\.webmanifest$|index\.html$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
}

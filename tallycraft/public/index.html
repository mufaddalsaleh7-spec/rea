<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>TallyCraft · Accounting workspace</title>
    <meta
      name="description"
      content="TallyCraft is a keyboard-first double-entry accounting workspace: vouchers, ledgers, trial balance, balance sheet, P&L, inventory and Tally XML interchange."
    />
    <meta name="theme-color" content="#0f4c81" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="TallyCraft" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TallyCraft" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32 16x16" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span class="brand-text">
          <strong>TallyCraft</strong>
          <small id="brand-company">Loading company…</small>
        </span>
      </div>
      <nav class="mainnav" id="mainnav" aria-label="Primary">
        <button data-nav="gateway" class="active">Gateway</button>
        <button data-nav="masters">Masters</button>
        <button data-nav="vouchers">Transactions</button>
        <button data-nav="reports">Reports</button>
        <button data-nav="data">Data</button>
      </nav>
      <div class="topbar-meta">
        <span
          id="tallycraft-boot-mode"
          class="pill"
          hidden
          title="Rendered from the copy inlined in this page because the API was unreachable"
          >offline copy</span
        >
        <span id="fy-label" class="pill">FY</span>
        <span id="net-status" class="pill" data-state="online" hidden></span>
        <button
          id="install-app"
          class="pill pill-action"
          type="button"
          hidden
          title="Install TallyCraft as an app"
        >
          Install app
        </button>
        <span class="clock" id="clock"></span>
      </div>
    </header>

    <div class="ticker" id="ticker" role="status" aria-live="polite">
      <span class="ticker-dot"></span>
      <span id="ticker-text">Connecting to the ledger…</span>
      <button id="ticker-action" class="link-button" hidden></button>
    </div>

    <main id="view" class="view" tabindex="-1">
      <div class="loading">Loading the ledger…</div>
    </main>

    <footer class="keybar" aria-label="Keyboard shortcuts">
      <span class="keybar-label">Shortcuts</span>
      <span><kbd>F4</kbd> Contra</span>
      <span><kbd>F5</kbd> Payment</span>
      <span><kbd>F6</kbd> Receipt</span>
      <span><kbd>F7</kbd> Journal</span>
      <span><kbd>F8</kbd> Sales</span>
      <span><kbd>F9</kbd> Purchase</span>
      <span><kbd>Alt</kbd>+<kbd>F1</kbd> Detailed</span>
      <span><kbd>Ctrl</kbd>+<kbd>A</kbd> Accept</span>
      <span><kbd>Esc</kbd> Back</span>
      <span><kbd>?</kbd> Help</span>
    </footer>

    <div id="modal-root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>

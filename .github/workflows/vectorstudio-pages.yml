name: VectorStudio Pages

# Publishes both VectorStudio editions to GitHub Pages:
#   /                     landing page (this repository's index.html)
#   /vectorstudio.html    single-file classic editor (works offline)
#   /app/                 React + PHP web workspace bundle (static front end;
#                         its PHP API is served separately, see the app README)
#
# Enable once: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches:
      - main
    paths:
      - vectorstudio.html
      - index.html
      - apps/vectorstudio-web/**
      - .github/workflows/vectorstudio-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vectorstudio-pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the React workspace
        working-directory: apps/vectorstudio-web
        run: |
          set -eu
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble static site
        run: |
          set -eu
          test -f vectorstudio.html
          test -f index.html
          test -f apps/vectorstudio-web/dist/index.html
          mkdir -p _site/app
          cp index.html vectorstudio.html _site/
          cp -r apps/vectorstudio-web/dist/. _site/app/
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
          ls -la _site _site/app

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
